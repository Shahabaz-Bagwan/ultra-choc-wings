# Coin cell budget: see docs/power.md.
# Deep sleep after 15 minutes idle; any key wakes the half.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Per-key LEDs: off at boot, 10 % when switched on, off whenever idle.
CONFIG_ZMK_BACKLIGHT=y
CONFIG_PWM=y
CONFIG_LED_PWM=y
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_BRT_START=10
CONFIG_ZMK_BACKLIGHT_BRT_STEP=10
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# The XIAO battery divider reads the coin cell through the Schottky diode
# (about 2.7 V), which ZMK's Li-ion curve reports as 0 %. Don't bother.
CONFIG_ZMK_BATTERY_REPORTING=n
