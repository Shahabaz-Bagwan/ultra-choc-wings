units:
    kx: 16
    ky: 16
    px: 18
    py: 17
    ksx: px-kx
    ksy: py-ky
    lpx: px + 1
    stagger1: 12
    stagger2: 6
    stagger3: -6.625
    stagger4: -2.375
    coin_x: 22
    coin_y: -10
    hole_top_x: 24.5
    hole_top_y: 59.5
    hole_bottom_x: 2
    hole_bottom_y: -10.8
    hole_thumb_x: 76.5
    hole_thumb_y: -2.5
    top_flat_x: 40
    bottom_x: 21
    bottom_y: -26.5
    bottom_left_y: -10
    corner_r: 3
    mcu_top: 28.9
    xiao_length: 21
    xiao_width: 17.78
points:
    key:
        spread: 1px
        padding: 1py
    zones:
        matrix:
            columns:
                pinky:
                    key:
                        column_net: P5
                ring:
                    key:
                        stagger: stagger1
                        column_net: P3
                middle:
                    key:
                        stagger: stagger2
                        column_net: P2
                index:
                    key:
                        stagger: stagger3
                        column_net: P1
                inner:
                    key:
                        stagger: stagger4
                        column_net: P0
            rows:
                bottom:
                    row_net: P10
                home:
                    row_net: P9
                top:
                    row_net: P8
        thumbfan:
            anchor:
                ref: matrix_pinky_bottom
            key:
                spread: 0
            columns:
                inner:
                    key:
                        adjust:
                            shift:
                                - 48.1
                                - -8.59
                        column_net: P2
                middle:
                    key:
                        adjust:
                            shift:
                                - 68.15
                                - -11.18
                            rotate: -15
                        column_net: P1
                home:
                    key:
                        adjust:
                            shift:
                                - 88.75
                                - -14.39
                            rotate: -30
                        column_net: P0
            rows:
                thumb:
                    row_net: P4
outlines:
    board_noround:
        main:
            what: polygon
            points:
                -
                    ref: matrix_pinky_top
                    shift:
                        - '-0.5lpx'
                        - mcu_top
                -
                    ref: matrix_pinky_top
                    shift:
                        - top_flat_x
                        - mcu_top
                -
                    ref: matrix_inner_top
                    shift:
                        - 0.5lpx
                        - 0.5py+1
                -
                    ref: matrix_inner_bottom
                    shift:
                        - 0.5lpx
                        - '-0.5py'
                -
                    ref: thumbfan_home_thumb
                    shift:
                        - 0.5lpx+0.5
                        - 0.5py+0.5
                -
                    ref: thumbfan_home_thumb
                    shift:
                        - 0.5lpx+0.5
                        - '-0.5py-0.5'
                -
                    ref: matrix_pinky_bottom
                    shift:
                        - bottom_x
                        - bottom_y
                -
                    ref: matrix_pinky_bottom
                    shift:
                        - '-0.5lpx'
                        - bottom_left_y
    board:
        -
            what: outline
            name: board_noround
            fillet: corner_r
    top_plate_base:
        keys:
            what: polygon
            points:
                -
                    ref: matrix_pinky_top
                    shift:
                        - '-0.5kx'
                        - 0.5ky
                -
                    ref: matrix_pinky_top
                    shift:
                        - 0.5kx+ksx
                        - 0.5ky
                -
                    ref: matrix_ring_top
                    shift:
                        - '-0.5kx'
                        - 0.5ky
                -
                    ref: matrix_ring_top
                    shift:
                        - 0.5kx+ksx
                        - 0.5ky
                -
                    ref: matrix_middle_top
                    shift:
                        - '-0.5kx'
                        - 0.5ky
                -
                    ref: matrix_middle_top
                    shift:
                        - 0.5kx
                        - 0.5ky
                -
                    ref: matrix_index_top
                    shift:
                        - '-0.5kx-ksx'
                        - 0.5ky
                -
                    ref: matrix_index_top
                    shift:
                        - 0.5kx
                        - 0.5ky
                -
                    ref: matrix_inner_top
                    shift:
                        - '-0.5kx-ksx'
                        - 0.5ky
                -
                    ref: matrix_inner_top
                    shift:
                        - 0.5kx
                        - 0.5ky
                -
                    ref: thumbfan_home_thumb
                    shift:
                        - 0.5kx
                        - '-0.5ky'
                -
                    ref: thumbfan_middle_thumb
                    shift:
                        - '-0.5kx'
                        - '-0.5ky'
                -
                    ref: matrix_index_bottom
                    shift:
                        - '-0.5kx'
                        - '-0.5ky'
                -
                    ref: matrix_middle_bottom
                    shift:
                        - 0.5kx+ksx
                        - '-0.5ky'
                -
                    ref: matrix_middle_bottom
                    shift:
                        - '-0.5kx-ksx'
                        - '-0.5ky'
                -
                    ref: matrix_ring_bottom
                    shift:
                        - 0.5kx
                        - '-0.5ky'
                -
                    ref: matrix_ring_bottom
                    shift:
                        - '-0.5kx-ksx'
                        - '-0.5ky'
                -
                    ref: matrix_pinky_bottom
                    shift:
                        - 0.5kx
                        - '-0.5ky'
                -
                    ref: matrix_pinky_bottom
                    shift:
                        - '-0.5kx'
                        - '-0.5ky'
    top_plate:
        top_plate_base:
            what: outline
            name: top_plate_base
            fillet: 1
        cutouts:
            what: rectangle
            where: true
            size: 14
            operation: subtract
pcbs:
    main:
        outlines:
            main:
                outline: board
        footprints:
            pg1316s_switch:
                what: pg1316s
                where: true
                params:
                    from: '{{colrow}}'
                    to: '{{column_net}}'
            diode:
                what: rev_smd2
                where: /matrix_/
                params:
                    designator: D
                    package: SOD123
                    polarized: true
                    value: 1N4148W
                    pad1: '{{row_net}}'
                    pad2: '{{colrow}}'
                adjust:
                    shift:
                        - 2.6
                        - -7.2
            diode_thumb:
                what: rev_smd2
                where: /thumbfan_/
                params:
                    designator: D
                    package: SOD123
                    polarized: true
                    value: 1N4148W
                    pad1: '{{row_net}}'
                    pad2: '{{colrow}}'
                adjust:
                    shift:
                        - 1.3
                        - 7.2
            led:
                what: rev_smd2
                where: true
                params:
                    designator: L
                    package: LED0603
                    polarized: true
                    value: LED_red_0603
                    pad1: LED_K
                    pad2: 'LA_{{colrow}}'
                adjust:
                    shift:
                        - 0
                        - 2.5
            led_resistor:
                what: rev_smd2
                where: /matrix_/
                params:
                    designator: R
                    package: '0603'
                    value: 1k
                    pad1: VCC3
                    pad2: 'LA_{{colrow}}'
                adjust:
                    shift:
                        - -2.6
                        - -7.2
            led_resistor_thumb:
                what: rev_smd2
                where: /thumbfan_/
                params:
                    designator: R
                    package: '0603'
                    value: 1k
                    pad1: VCC3
                    pad2: 'LA_{{colrow}}'
                adjust:
                    shift:
                        - -3.9
                        - 7.2
            xiao_flippable:
                what: xiao_flippable
                where:
                    ref: matrix_pinky_top
                    shift:
                        - 0.5px-0.5ksx-xiao_width-(kx-xiao_width)/2
                        - 0.5py+0.5ksy
                    rotate: -90
            raw_pad:
                what: pad
                where:
                    ref: matrix_pinky_top
                    shift:
                        - 0
                        - 0.5py
                params:
                    net: RAW
                    width: 1.5
                    height: 1.5
            coin_cell:
                what: rev_coincell
                where:
                    ref: matrix_pinky_bottom
                    shift:
                        - coin_x
                        - coin_y
                params:
                    pos: BAT
                    neg: GND
            power_switch:
                what: rev_slider
                where:
                    ref: matrix_pinky_top
                    shift:
                        - 17
                        - mcu_top-3
                params:
                    from: BAT
                    to: SW_BAT
            power_diode:
                what: rev_smd2
                where:
                    ref: matrix_pinky_bottom
                    shift:
                        - 29
                        - 9
                params:
                    designator: D
                    package: SOD123
                    polarized: true
                    value: B5819W
                    pad1: RAW
                    pad2: SW_BAT
            bulk_cap_1:
                what: rev_smd2
                where:
                    ref: matrix_pinky_bottom
                    shift:
                        - 29
                        - 5.5
                params:
                    designator: C
                    package: 0805
                    value: 22uF
                    pad1: RAW
                    pad2: GND
            bulk_cap_2:
                what: rev_smd2
                where:
                    ref: matrix_pinky_bottom
                    shift:
                        - 33
                        - 3
                params:
                    designator: C
                    package: 0805
                    value: 22uF
                    pad1: RAW
                    pad2: GND
            led_mosfet:
                what: rev_sot23
                where:
                    ref: matrix_pinky_bottom
                    shift:
                        - 39
                        - 7
                    rotate: 90
                params:
                    designator: Q
                    value: AO3400A
                    pad1: P6
                    pad2: GND
                    pad3: LED_K
            led_gate_pulldown:
                what: rev_smd2
                where:
                    ref: matrix_pinky_bottom
                    shift:
                        - 39
                        - 2.5
                    rotate: 90
                params:
                    designator: R
                    package: '0603'
                    value: 100k
                    pad1: P6
                    pad2: GND
            mount_top:
                what: m2_hole
                where:
                    ref: matrix_pinky_bottom
                    shift:
                        - hole_top_x
                        - hole_top_y
            mount_bottom:
                what: m2_hole
                where:
                    ref: matrix_pinky_bottom
                    shift:
                        - hole_bottom_x
                        - hole_bottom_y
            mount_thumb:
                what: m2_hole
                where:
                    ref: matrix_pinky_bottom
                    shift:
                        - hole_thumb_x
                        - hole_thumb_y
    top_plate:
        outlines:
            top_plate:
                outline: top_plate
